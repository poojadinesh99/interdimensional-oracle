<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interdimensional Oracle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1>Interdimensional Oracle</h1>
        <p>Ask a concise question and receive a guided answer.</p>
        <div class="controls">
          <textarea id="question" placeholder="What should I do next?"></textarea>
          <button id="ask">Ask the Oracle</button>
        </div>
        <pre id="output">Awaiting your question…</pre>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
