# LiteLLM gateway in front of the model.
#
#   cp backend/.env.example backend/.env    # fill in GOOGLE_API_KEY and LITELLM_MASTER_KEY
#   docker compose up -d litellm
#   uvicorn backend.app.main:app --port 8000
#
# The app reaches the gateway at LITELLM_BASE_URL (default http://localhost:4000).
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./gateway/litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - backend/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 5
